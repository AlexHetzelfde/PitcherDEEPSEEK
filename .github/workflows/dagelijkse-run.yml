name: Dagelijkse nieuwsrun

# Draait automatisch elke nacht om 04:00 NEDERLANDSE TIJD. Omdat GitHub-cron
# altijd in UTC rekent en Nederland twee keer per jaar van tijdzone wisselt,
# zijn er twee cron-regels nodig:
#
#   - Zomertijd (CEST, UTC+2, eind maart t/m eind oktober):
#       04:00 NL = 02:00 UTC  →  "0 2 * 4,5,6,7,8,9,10 *"
#   - Wintertijd (CET, UTC+1, eind oktober t/m eind maart):
#       04:00 NL = 03:00 UTC  →  "0 3 * 11,12,1,2,3 *"
#
# Samen dekken die twaalf maanden. Op de wisseldagen zelf (eind maart,
# eind oktober) kan de run een uur vroeger of later vallen dan 04:00; dat
# is inherent aan vaste cron-tijden en geen probleem voor deze pipeline.
#
# Het venster dat de run meeneemt:
#   nieuws: vanaf 00:00 NL van de VORIGE dag t/m nu  →  ongeveer 2 dagen
#   agenda: alleen evenementen die VANDAAG beginnen
# De run om 04:00 NL betekent dat de pitches om 08:00 NL klaarstaan.
#
# Handmatig starten kan altijd via de Actions-tab ("Run workflow"); zo'n
# handmatige run telt door de dag-ontdubbeling in werkBronGezondheidBij
# niet dubbel mee voor de "opeenvolgend leeg"-tellers.
#
# Sinds de "tijdzone"-ronde (2026-10-15):
#  - TZ=Europe/Amsterdam op job-niveau. Zonder deze variabele rekent Node in
#    UTC, en begint "vandaag" om 02:00 NL in plaats van 00:00 NL — het
#    nieuwsvenster zou dan 2 uur te ruim zijn.
#
# Sinds de ZANP-fase-2-ronde (2026-10-24):
#  - Deze run doet alleen nog de pitchmachine. De nieuwsdienst staat in
#    zanp-run.yml. De commitstap commit alleen nog de pitch-bestanden en
#    rebaset voor het pushen. De cronregels zijn bewust ongewijzigd.
#
# Sinds de "04:00-ronde" (2026-10-15):
#  - Twee cron-regels voor 04:00 NL in zowel zomer- als wintertijd.
#  - concurrency + timeout-minutes toegevoegd als vangnet.
#  - Het comment-blok over zomer/wintertijd rechtgezet (stond omgekeerd).

on:
  workflow_dispatch: {}
  schedule:
    # Zomertijd: 04:00 NL = 02:00 UTC
    - cron: "0 0 * 4,5,6,7,8,9,10 *"
    # Wintertijd: 04:00 NL = 03:00 UTC
    - cron: "0 1 * 11,12,1,2,3 *"

# Eén run tegelijk. Twee runs na elkaar (bijv. handmatig + schedule) zouden
# anders tegelijk op data/*.json pushen en de tweede push zou falen.
concurrency:
  group: dagelijkse-run
  cancel-in-progress: false

permissions:
  contents: write       # nodig om de data/*.json bestanden terug te committen
  pull-requests: write  # zelfherstel: een kapotte bron als pull request voorstellen
  issues: write         # zelfherstel: een issue openen als er niets werkends te vinden is

jobs:
  scrape-en-beoordeel:
    runs-on: ubuntu-latest
    # Harde bovengrens: een hangende feed mag de job niet urenlang laten
    # doorlopen. De normale duur is 10-20 minuten; 60 minuten is ruim.
    timeout-minutes: 60
    env:
      # Alle stappen in deze job (en dus alle Node-processen) rekenen in
      # Nederlandse tijd. Dit beïnvloedt new Date(), toLocaleDateString, en
      # daarmee het nieuwsvenster en de agenda-check.
      TZ: Europe/Amsterdam
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Geen 'cache: npm' — daarvoor is een package-lock.json nodig,
          # en die leveren we bewust niet mee (zie scraper/package.json).

      - name: Dependencies installeren
        working-directory: scraper
        run: npm install

      - name: bronnen.js valideren
        working-directory: scraper
        run: node valideer-bronnen.js

      - name: Scraper draaien
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm start

      # Alleen de bestanden van de pitchmachine. De nieuwsdienst (zanp-run.yml)
      # schrijft berichten.json, agenda.json en zanp-status.json; die mogen
      # hier niet meegaan en kunnen tijdens deze run van 10-20 minuten
      # tussentijds zijn gepusht. Daarom eerst rebasen, en bij een mislukte
      # push opnieuw proberen.
      - name: Resultaten committen
        run: |
          git config user.name "nieuwsaggregator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json data/nieuws-lokaal.json data/nieuws-landelijk.json data/pitches.json data/bron-gezondheid.json
          git diff --quiet --cached || git commit -m "Dagelijkse update: $(TZ='Europe/Amsterdam' date '+%Y-%m-%d %H:%M')"
          gelukt=0
          for poging in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then gelukt=1; break; fi
            echo "Push mislukte (poging $poging van 4), opnieuw proberen..."
            sleep $((poging * 5))
          done
          if [ "$gelukt" != "1" ]; then
            echo "::error::Pushen mislukte na 4 pogingen"
            exit 1
          fi

      # Zelfherstel: bronnen die twee runs achter elkaar niets opleverden worden
      # opnieuw uitgezocht. Het resultaat komt NOOIT direct op main, maar als pull
      # request (gelukt) of issue (mislukt), zodat jij met één klik beslist.
      # continue-on-error: dit is een extra. Als het faalt (bijvoorbeeld door een
      # tijdelijke GitHub- of Gemini-storing) mag de dagelijkse run daar niet rood
      # van worden, want de data is hierboven al veilig gecommit.
      - name: Bronnen die niets opleveren zelf laten herstellen
        continue-on-error: true
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node herstel-bronnen.js
