name: Bron toevoegen

# Handmatig te starten vanuit de Actions-tab, met invulvelden voor de URL,
# een zelfgekozen bron-id en de categorie. Draait volledig op GitHub,
# geen lokale computer, Terminal of git-kennis nodig.
#
# De bron wordt pas toegevoegd als is BEWEZEN dat hij werkt: de echte scraper
# moet berichten ophalen die aan de kwaliteitseisen voldoen (zie
# scraper/bron-poort.js). Lukt dat niet, dan wordt deze workflow rood en
# verandert er niets aan bronnen.js. In de samenvatting bovenaan de run staat
# wat er geprobeerd is en waarom het niet werkte.
#
# Sinds de ZANP-fase-2-ronde (2026-10-24): een nieuwe bron doet automatisch
# mee aan de nieuwsdienst en de agenda (zanp-run.yml). Daarvoor schrijft deze
# workflow ook een regel in scraper/rubrieken.json, met drie extra velden
# (rubriek, herkomst, agenda_filter). De standaard "behouden" betekent: een
# nieuwe bron wordt Overig / onbekend (alleen kop en link, geen AI-tekst) en
# een bestaande bron houdt zijn instellingen. Staat een rubriek niet in de
# lijst hieronder, voeg die dan ook hier toe.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL van de nieuwe nieuwspagina (of agenda)"
        required: true
        type: string
      bron_id:
        description: "Korte naam voor deze bron, geen spaties (bv. voorbeeld-nieuws)"
        required: true
        type: string
      categorie:
        description: "Categorie"
        required: true
        type: choice
        options:
          - lokaal
          - landelijk
        default: lokaal
      soort:
        description: "Soort bron. Auto herkent agenda's zelf; kies agenda als de datums de datum van het evenement zijn"
        required: true
        type: choice
        options:
          - auto
          - nieuws
          - agenda
        default: auto
      rubriek:
        description: "ZANP-rubriek van deze bron (behouden = bestaande instelling, of Overig bij een nieuwe bron)"
        required: true
        type: choice
        options:
          - behouden
          - BES
          - REC
          - PRV
          - CUL
          - ONW
          - LOK
          - ALG
        default: behouden
      herkomst:
        description: "Herkomst. signaal = andere redactie of aggregator (alleen kop en link). officieel/organisatie = de AI mag een korte samenvatting maken. behouden = bestaande instelling, of onbekend bij een nieuwe bron"
        required: true
        type: choice
        options:
          - behouden
          - signaal
          - officieel
          - organisatie
        default: behouden
      agenda_filter:
        description: "Alleen voor agendabronnen. alles = elk evenement tonen. eerste-of-jubileum = alleen eerste keer of jubileum. behouden = bestaande instelling, of alles bij een nieuwe bron"
        required: true
        type: choice
        options:
          - behouden
          - alles
          - eerste-of-jubileum
        default: behouden
      vervang:
        description: "Een bestaande bron met dit id vervangen, ook als die nog werkt (een kapotte bron wordt altijd vervangen)"
        required: true
        type: boolean
        default: false
      accepteer_twijfel:
        description: "Ook een kandidaat accepteren die slaagt maar niet als link op de pagina staat (alleen na het controleren van de voorbeelden)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write # nodig om bronnen.js en rubrieken.json terug te committen

jobs:
  voeg-bron-toe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies installeren
        working-directory: scraper
        run: npm install

      # De invoer gaat via omgevingsvariabelen en niet rechtstreeks in het
      # commando, zodat een vreemd teken in een url of id nooit als
      # shell-commando kan worden uitgevoerd.
      - name: Bron ophalen, analyseren en testen
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRON_URL: ${{ inputs.url }}
          BRON_ID: ${{ inputs.bron_id }}
          BRON_CATEGORIE: ${{ inputs.categorie }}
          SOORT: ${{ inputs.soort }}
          RUBRIEK: ${{ inputs.rubriek }}
          HERKOMST: ${{ inputs.herkomst }}
          AGENDA_FILTER: ${{ inputs.agenda_filter }}
          VERVANG: ${{ inputs.vervang }}
          ACCEPTEER_TWIJFEL: ${{ inputs.accepteer_twijfel }}
        run: node voeg-bron-toe.js "$BRON_URL" "$BRON_ID" "$BRON_CATEGORIE"

      - name: bronnen.js valideren (laatste check vóór commit)
        working-directory: scraper
        run: node valideer-bronnen.js

      - name: rubrieken.json valideren (laatste check vóór commit)
        working-directory: scraper
        run: node valideer-rubrieken.js

      # bronnen.js en rubrieken.json horen bij elkaar. Pushen met rebase en
      # nieuwe pogingen, want de ZANP-run (elk half uur) of de dagelijkse run
      # kan tussentijds hebben gepusht.
      - name: bronnen.js en rubrieken.json committen
        env:
          BRON_ID: ${{ inputs.bron_id }}
        run: |
          git config user.name "nieuwsaggregator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scraper/bronnen.js scraper/rubrieken.json
          git diff --quiet --cached || git commit -m "Bron toegevoegd of hersteld via workflow: $BRON_ID"
          gelukt=0
          for poging in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then gelukt=1; break; fi
            echo "Push mislukte (poging $poging van 4), opnieuw proberen..."
            sleep $((poging * 5))
          done
          if [ "$gelukt" != "1" ]; then
            echo "::error::Pushen mislukte na 4 pogingen"
            exit 1
          fi
